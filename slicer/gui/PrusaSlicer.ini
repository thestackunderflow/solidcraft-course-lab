# Lesson 5: PrusaSlicer 2.9.2 settings written by its own Configuration Wizard on 31 Oct 2026 (one run, with network,
# printer Original Prusa MK4S, 0.4 mm nozzle, the wizard's default filaments), saved so every take starts on the
# plate with no wizard. One line changed by hand: filament = Prusament PLA Blend @MK4S, the one plain PLA among the wizard's
# filaments that fits this printer (the wizard picked
# "Generic PLA Silk @MK4S"), and the start-up notices off for filming: no release, update, hint, splash or
# system-info pop-ups (notify_release none, preset_update 0, version_check 0, show_hints 0, show_splash_screen 0), and quitting it does not ask to save the plate (default_action_on_close_application
# discard: the "don't save" answer, remembered). The vendor profile is the bundled one (config_version 2.2.7, identical to the download).
alert_when_supports_needed = 1
allow_auto_color_change = 1
allow_ip_resolve = 1
angle_precision = 1.
auth_login_dialog_confirmed = 0
auto_toolbar_size = 100
background_processing = 0
clear_undo_redo_stack_on_new_project = 1
collapsed_sidebar = 0
color_mapinulation_panel = 0
connect_polling = 1
custom_toolbar_size = 100
default_action_on_close_application = discard
default_action_on_new_project = none
default_action_on_select_preset = none
downloader_url_registered = 1
drop_project_action = 1
export_sources_full_pathnames = 0
linear_precision = 0.005
no_controller = 1
no_defaults = 1
no_templates = 0
non_manifold_edges = 1
notify_release = none
order_volumes = 1
preset_update = 0
remember_output_path = 1
remember_output_path_removable = 1
restore_win_position = 1
reverse_mouse_wheel_zoom = 0
seq_top_layer_only = 1
show_drop_project_dialog = 1
show_estimated_times_in_dbl_slider = 1
show_hints = 0
show_incompatible_presets = 0
show_ruler_bg_in_dbl_slider = 1
show_ruler_in_dbl_slider = 0
show_splash_screen = 0
show_step_import_parameters = 1
single_instance = 0
url_downloader_dest = /work
use_binary_gcode_when_supported = 1
use_custom_toolbar_size = 0
use_free_camera = 0
use_inches = 0
use_perspective_camera = 1
version = 2.9.2
version_check = 0
version_system_info_sent = 2.9.2
view_mode = simple
wifi_config_dialog_declined = 0

[filaments]
Generic PETG @MK4S HF0.4 = 1
Generic PLA @MK4S HF0.4 = 1
Generic PLA Silk @MK4S = 1
Prusament ASA @MK4S HF0.4 = 1
Prusament PC Blend @MK4S HF0.4 = 1
Prusament PETG @MK4S HF0.4 = 1
Prusament PLA @MK4S HF0.4 = 1
Prusament PLA Blend @MK4S = 1

[presets]
filament = Prusament PLA Blend @MK4S
physical_printer = 
print = 0.20mm SPEED @MK4S 0.4
printer = Original Prusa MK4S 0.4 nozzle
sla_material = 
sla_print = 

[vendor:PrusaResearch]
model:MK4S = 0.4

